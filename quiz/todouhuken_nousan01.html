<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小学生向けクイズアプリ</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f0f9ff;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border-4 border-sky-300">
        
        <!-- Header / Title -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-sky-600 mb-2">✨ たのしいクイズ大会 ✨</h1>
            <p class="text-green-600 text-lg">都道府県の農産物クイズ！　何ポイントゲットできるかな？</p>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="text-center py-8">
            <div class="mb-6 text-6xl">🌟</div>
            <p class="text-lg text-gray-700 mb-6 leading-relaxed">
                ぜんぶで7もんのクイズがあるよ。<br>
                せいかいすると 10ポイントゲット！<br>
                ぜん問正解をめざしてがんばろう！
            </p>
            <button onclick="playSound('action'); startQuiz()" class="bg-amber-400 hover:bg-amber-500 text-gray-800 font-bold text-xl px-8 py-4 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95">
                クイズをはじめる！
            </button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <!-- Progress & Score Bar -->
            <div class="flex justify-between items-center mb-4 bg-sky-50 p-3 rounded-xl border border-sky-200">
                <span id="question-number" class="text-lg font-bold text-sky-700">もんだい 1 / 7</span>
                <span id="current-score" class="text-lg font-bold text-amber-600">ポイント: 0点</span>
            </div>

            <!-- Question Image -->
            <div class="mb-4 overflow-hidden rounded-2xl shadow-md h-40 bg-sky-100 flex items-center justify-center">
                <img id="question-image" src="" alt="もんだいのしゃしん" class="w-100 h-40 object-cover" onerror="this.src='https://placehold.co/600x400/e0f2fe/0284c7?text=Quiz+Image'">
            </div>

            <!-- Question Text -->
            <h2 id="question-text" class="text-xl sm:text-xl font-bold text-gray-800 mb-4 leading-relaxed">
                <!-- Question loaded via JS -->
            </h2>

            <!-- Options Container: Horizontal Row (3 Columns) -->
            <div id="options-container" class="grid grid-cols-3 gap-2 sm:gap-3 mb-4">
                <!-- Options buttons loaded dynamically via JS -->
            </div>

            <!-- Feedback Area (Hidden initially) -->
            <div id="feedback-area" class="hidden p-4 rounded-2xl mb-3 text-center">
                <h3 id="feedback-title" class="text-2xl font-bold mb-2"></h3>
                <p id="feedback-explanation" class="text-gray-700 text-lg leading-relaxed"></p>
            </div>

            <!-- Next Button (Hidden initially) -->
            <button id="next-button" onclick="playSound('action'); nextQuestion()" class="hidden w-full bg-sky-500 hover:bg-sky-600 text-white font-bold text-lg py-3 rounded-2xl shadow-md transition transform hover:scale-[1.01]">
                つぎのもんだいへすすむ
            </button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden text-center py-6">
           <div class="text-6xl mb-4">🏆</div>
            <h2 class="text-2xl sm:text-3xl font-bold text-sky-700 mb-4">おつかれさまでした！</h2>
            <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-6 mb-6">
                <p class="text-gray-600 text-xl mb-2">あなたのけっか</p>
                <p id="final-score" class="text-4xl sm:text-5xl font-extrabold text-amber-600 mb-2">70 / 70 点</p>
                <p id="encouragement-message" class="text-gray-700 text-lg font-medium"></p>
            </div>
             <button onclick="playSound('action'); restartQuiz()" class="bg-amber-400 hover:bg-amber-500 text-gray-800 font-bold text-lg px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105">
                もういちどちょうせんする
            </button>
            <button onclick="playSound('finish'); finishQuiz()" class="bg-sky-500 hover:bg-sky-600 text-white font-bold text-lg px-8 py-3 rounded-full shadow-lg transition transform hover:scale-105 mt-3 sm:mt-0 sm:ml-2">
                クイズをおわる
            </button>
        </div>
    </div>

    <script>
        // Sound effect settings suitable for 3rd graders
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'option') {
                    // Answer button click: Fun short pop sound
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'action') {
                    // Start, Next, Restart buttons: Exciting chime
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'finish') {
                    // "End Quiz" button: Cheerful happy jingle
                    const notes = [523.25, 587.33, 659.25, 698.46, 783.99];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.15);
                    });
                } else if (type === 'correct') {
                    // Correct answer: Power charging up sound (ascending arpeggio + chime)
                    const frequencies = [300, 450, 600, 750, 950];
                    frequencies.forEach((f, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now + idx * 0.06);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.06);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.15);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.06);
                        osc.stop(now + idx * 0.06 + 0.15);
                    });
                } else if (type === 'incorrect') {
                    // Incorrect answer: Dropping mood sound
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.linearRampToValueAtTime(130, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'applause') {
                    // Result: High score applause / celebratory chime fanfar
                    const chord = [523.25, 659.25, 783.99, 1046.50];
                    chord.forEach((freq) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now);
                        osc.stop(now + 0.6);
                    });
                } else if (type === 'sad_result') {
                    // Result: Low score disappointment sound
                    const notes = [350, 310, 260];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.2);
                        gain.gain.setValueAtTime(0.15, now + idx * 0.2);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.2 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.2);
                        osc.stop(now + idx * 0.2 + 0.25);
                    });
                }
            } catch (e) {
                console.log("Audio playback error:", e);
            }
        }

        // Quiz Data in JSON format tailored for 3rd graders
        const quizData = [
            {
                question: "日本で１番、「米」の生産量が多い都道府県はどこ？\n ヒント：中部地方の日本海側にある都道府県です。",
                image: "https://tsukatte.com/wp-content/uploads/2022/01/rice_masu.png?auto=format&fit=crop&w=600&q=80",
                options: ["ア．秋田県", "イ．山形県", "ウ．新潟県"],
                answer: 2,
                explanation: "正解は、ウの新潟県。特に魚沼（うおぬま）産のコシヒカリは高級ブランドのお米です。"
            },
            {
                question: "日本で１番、「みかん」の生産量が多い都道府県はどこ？\n ヒント：近畿（きんき）地方にあり、太平洋に面している都道府県です。",
                image: "https://illust8.com/wp-content/uploads/2018/10/fruit_mikan_illust_1796.png?auto=format&fit=crop&w=600&q=80",
                options: ["ア．愛媛県", "イ．和歌山県", "ウ．熊本県"],
                answer: 1,
                explanation: "正解は、イの和歌山県。地名のついた「有田（ありた）みかん」が有名（ゆうめい）です。"
            },
            {
                question: "日本で１番、「茶葉（ちゃば）」の生産量が多い都道府県はどこ？\n ヒント：中部地方にあり、太平洋に面する都道府県です。",
                image: "https://illust8.com/wp-content/uploads/2021/06/greentea_leaf_13778.png?auto=format&fit=crop&w=600&q=80",
                options: ["ア．埼玉県", "イ．長野県", "ウ．静岡県"],
                answer: 2,
                explanation: "正解は、ウの静岡県。品質の高いお茶で全国のおよそ40％をしめています。"
            },
            {
                question: "日本で１番、「さつまいも」の生産量が多い都道府県はどこ？\n ヒント：九州地方にあり、太平洋に面する都道府県です。",
                image: "https://cdn-ak.f.st-hatena.com/images/fotolife/N/Newdonut/20250923/20250923215613.png?auto=format&fit=crop&w=600&q=80",
                options: ["ア．福岡県", "イ．鹿児島県", "ウ．埼玉県"],
                answer: 1,
                explanation: "正解は、イの鹿児島県。鹿児島県は昔、「薩摩国（さつまのくに）」といいました。"
            },

            {
                question: "日本で１番、「生乳（せいにゅう）」の生産量が多い都道府県はどこ？\n ヒント：日本の北側にある都道府県です。",
                image: "https://onwa-illust.com/wp-content/uploads/2022/03/cow_milk_02-360x360.png?auto=format&fit=crop&w=600&q=80",
                options: ["ア．福島県", "イ．北海道", "ウ．栃木県"],
                answer: 1,
                explanation: "正解は、イの北海道。酪農（らくのう）がさかんで、乳用牛の飼育（しいく）数が日本一です。"
            },
            {
                question: "日本で１番、「りんご」の生産量が多い都道府県はどこ？\n ヒント：東北地方にあり、太平洋と日本海に面している都道府県です。",
                image: "https://illust8.com/wp-content/uploads/2018/06/fruit_apple_illust_150.png?auto=format&fit=crop&w=600&q=80",
                options: ["ア．青森県", "イ．山梨県", "ウ．長野県"],
                answer: 0,
                explanation: "正解は、アの青森県。リンゴの旬（しゅん）は秋から冬にかけてで、涼しい気候での栽培に適しています。"
            },
            {
                question: "日本で１番、「じゃがいも・たまねぎ・にんじん」の生産量が多い都道府県はどこ？\n ヒント：日本の北の方にある都道府県です。",
                image: "https://blog-imgs-26.fc2.com/s/o/r/sorarindesign/n_j_t01.png?auto=format&fit=crop&w=600&q=80",
                options: ["ア．北海道", "イ．佐賀県", "ウ．兵庫県"],
                answer: 0,
                explanation: "正解は、アの北海道。とくに、じゃがいもや玉ねぎは日本全体の６０パーセント以上を生産しています。 "
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // Start Quiz Function
        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        }

        // Load Question Function
        function loadQuestion() {
            isAnswered = false;
            const q = quizData[currentQuestionIndex];

            document.getElementById('start-screen').classList.add('hidden');
            // Update Progress
            document.getElementById('question-number').innerText = `もんだい ${currentQuestionIndex + 1} / ${quizData.length}`;
            document.getElementById('current-score').innerText = `ポイント: ${score}点`;

            // Update Image
            document.getElementById('question-image').src = q.image;

            // Update Question Text
            document.getElementById('question-text').innerText = q.question;

            // Render Options in 3 horizontal buttons
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-center bg-sky-50 hover:bg-sky-100 border-2 border-sky-300 text-gray-800 font-bold text-lg p-3 sm:p-4 rounded-xl transition transform active:scale-95 flex items-center justify-center min-h-[60px]";
                btn.innerText = option;
                btn.onclick = () => {
                    playSound('option');
                    selectAnswer(index);
                };
                container.appendChild(btn);
            });

            // Hide Feedback & Next Button
            document.getElementById('feedback-area').classList.add('hidden');
            document.getElementById('next-button').classList.add('hidden');
        }

        // Select Answer Function
        function selectAnswer(selectedIndex) {
            if (isAnswered) return;
            isAnswered = true;

            const q = quizData[currentQuestionIndex];
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackExplanation = document.getElementById('feedback-explanation');
            const nextButton = document.getElementById('next-button');

            // Disable further clicks on options
            const optionButtons = document.getElementById('options-container').getElementsByTagName('button');
            for (let i = 0; i < optionButtons.length; i++) {
                optionButtons[i].disabled = true;
                if (i === q.answer) {
                    optionButtons[i].classList.remove('bg-sky-50', 'border-sky-200');
                    optionButtons[i].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                } else if (i === selectedIndex && selectedIndex !== q.answer) {
                    optionButtons[i].classList.remove('bg-sky-50', 'border-sky-200');
                    optionButtons[i].classList.add('bg-rose-100', 'border-rose-400', 'text-rose-900');
                }
            }

            feedbackArea.classList.remove('hidden');

            if (selectedIndex === q.answer) {
                score += 10;
                document.getElementById('current-score').innerText = `ポイント: ${score}点`;
                feedbackArea.className = "p-4 rounded-2xl mb-4 bg-emerald-50 border-2 border-emerald-300 text-center";
                feedbackTitle.innerHTML = "⭕ みごと せいかい！ (+10点)";
                feedbackTitle.className = "text-2xl font-bold mb-2 text-emerald-700";
                playSound('correct');
            } else {
                feedbackArea.className = "p-4 rounded-2xl mb-4 bg-rose-50 border-2 border-rose-300 text-center";
                feedbackTitle.innerHTML = "❌ ざんねん！ 不正解…";
                feedbackTitle.className = "text-2xl font-bold mb-2 text-rose-700";
                playSound('incorrect');
            }

            feedbackExplanation.innerText = q.explanation;
            nextButton.classList.remove('hidden');
        }

        // Next Question or Finish
        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // Show Result Screen
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const maxScore = quizData.length * 10;
            document.getElementById('final-score').innerText = `${score} / ${maxScore} 点`;

            const msgElement = document.getElementById('encouragement-message');
            if (score >= maxScore * 0.7) {
                msgElement.innerText = score === maxScore ? "すごすぎる！全問正解おめでとう！君は「クイズはかせ」だね！" : "よくがんばったね！すばらしい成績だよ！";
                playSound('applause');
            } else {
                msgElement.innerText = "よくちょうせんしたね！もういちどプレイして、もっと高い点数をめざそう！";
                playSound('sad_result');
            }
        }

        // Restart Quiz
        function restartQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
        // Finish Quiz
        function finishQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('app').innerHTML = `
                <div class="text-center py-12">
                    <div class="text-6xl mb-4">👋</div>
                    <h2 class="text-2xl sm:text-3xl font-bold text-sky-700 mb-4">おつかれさまでした！</h2>
                    <p class="text-gray-700 text-lg">またクイズであそびにきてね！</p>
                </div>
            `;
        }
    </script>
</body>
</html>
